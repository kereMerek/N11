<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Dilek Tut ve Üfle - Pixel Art</title>

    <!-- Google Pixel Fonts (Silkscreen: Geniş Türkçe karakter destekli retro font) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* =====================================================================
           TEMEL SIFIRLAMA & PİKSEL AYARLARI
           ===================================================================== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #04020c;
            font-family: 'Silkscreen', monospace;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            -webkit-text-size-adjust: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        body {
            position: fixed;
            inset: 0;
        }

        /* =====================================================================
           RETRO PİKSEL ÇERÇEVELERİ
           ===================================================================== */
        .pixel-box {
            background: rgba(6, 10, 26, 0.92);
            border: 3px solid #70d6ff;
            box-shadow: 
                0 0 0 3px #04020c,
                0 0 0 6px #ffffff,
                0 0 25px rgba(112, 214, 255, 0.4);
            padding: 1.2rem 1.6rem;
            position: relative;
        }

        .pixel-box::before, .pixel-box::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ffffff;
        }
        .pixel-box::before { top: -3px; left: -3px; }
        .pixel-box::after  { bottom: -3px; right: -3px; }

        /* =====================================================================
           BAŞLANGIÇ EKRANI (RETRO TITLE SCREEN)
           ===================================================================== */
        #startScreen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #04020c;
            z-index: 100;
            cursor: pointer;
            transition: opacity 1.2s steps(8, end);
            padding: 1.5rem;
        }

        #startScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .title-badge {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(9px, 2.5vw, 13px);
            color: #70d6ff;
            letter-spacing: 0.1em;
            margin-bottom: 1.8rem;
            text-shadow: 2px 2px 0px #04020c, 0 0 10px rgba(112, 214, 255, 0.7);
            animation: blinkBadge 2s infinite steps(2, start);
        }

        #startScreen .message {
            color: #fff4e0;
            font-size: clamp(15px, 4.2vw, 22px);
            text-align: center;
            line-height: 1.8;
            text-shadow: 2px 2px 0px #000000;
        }

        #startScreen .tap-hint {
            font-family: 'Press Start 2P', monospace;
            color: #ffffff;
            background: #142850;
            border: 2px solid #70d6ff;
            box-shadow: 3px 3px 0px #000000;
            font-size: clamp(10px, 2.8vw, 13px);
            margin-top: 2rem;
            padding: 0.8rem 1.4rem;
            animation: retroBlink 1.2s steps(2, start) infinite;
            text-align: center;
            line-height: 1.6;
        }

        /* =====================================================================
           CANVAS (PIXEL ART ENGINE)
           ===================================================================== */
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            transition: opacity 2s steps(8, end);
        }

        #canvas.fade-out {
            opacity: 0;
        }

        /* =====================================================================
           YÖNLENDİRME METNİ (RETRO BANNER)
           ===================================================================== */
        #guideContainer {
            position: fixed;
            top: 6%;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 440px;
            z-index: 10;
            opacity: 0;
            transition: opacity 1.5s steps(6, end);
            pointer-events: none;
        }

        #guideContainer.visible {
            opacity: 1;
        }

        #guideContainer.fade-out {
            opacity: 0 !important;
        }

        #guideText {
            color: #ffffff;
            font-size: clamp(12px, 3.4vw, 16px);
            text-align: center;
            line-height: 1.8;
            text-shadow: 2px 2px 0px #000000;
        }

        .guide-indicator {
            display: block;
            margin-top: 0.4rem;
            color: #70d6ff;
            font-size: 11px;
            animation: indicatorBlink 1s steps(2, start) infinite;
        }

        /* =====================================================================
           FİNAL EKRANI (RETRO JRPG DIALOGUE BOX + PIXEL HEART)
           ===================================================================== */
        #finalMessage {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            opacity: 0;
            transition: opacity 2.5s steps(10, end);
            pointer-events: none;
            padding: 1.5rem;
        }

        #finalMessage.visible {
            opacity: 1;
        }

        .dialogue-box {
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        #finalMessage .line1 {
            color: #fff0d4;
            font-size: clamp(14px, 4vw, 20px);
            line-height: 1.8;
            text-shadow: 2px 2px 0px #000000;
        }

        #finalMessage .line3 {
            color: #70d6ff;
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(13px, 3.6vw, 18px);
            margin-top: 1.4rem;
            line-height: 1.6;
            text-shadow: 2px 2px 0px #000000;
        }

        /* =====================================================================
           MAVİ VE BEYAZ PİKSEL KALP (8-BIT PIXEL ART HEART)
           ===================================================================== */
        #finalHeart {
            margin-top: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 1.5s steps(6, end) 0.6s;
            animation: pixelHeartbeat 1.4s steps(2, start) infinite;
            animation-play-state: paused;
            filter: drop-shadow(0 0 15px rgba(112, 214, 255, 0.85))
                    drop-shadow(0 0 35px rgba(30, 144, 255, 0.6));
        }

        #finalMessage.visible #finalHeart {
            opacity: 1;
            animation-play-state: running;
        }

        .pixel-heart-svg {
            width: clamp(56px, 15vw, 84px);
            height: clamp(50px, 13.5vw, 75px);
            image-rendering: pixelated;
        }

        /* =====================================================================
           RETRO KEYFRAME ANİMASYONLARI
           ===================================================================== */
        @keyframes retroBlink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.25; }
        }

        @keyframes blinkBadge {
            0%, 70% { opacity: 1; }
            71%, 100% { opacity: 0.5; }
        }

        @keyframes indicatorBlink {
            0%, 50% { transform: translateY(0); }
            51%, 100% { transform: translateY(3px); }
        }

        @keyframes pixelHeartbeat {
            0%, 50% {
                transform: scale(1);
            }
            51%, 100% {
                transform: scale(1.18);
            }
        }
    </style>
</head>
<body>

    <script>
    (function () {
        'use strict';

        // =====================================================================
        // PIXEL ART SABİTLERİ (Chunky Retro Scaling)
        // =====================================================================
        var PIXEL_SIZE = 3; // Sanal piksel boyutu (mobilde ideal 3px)

        var CFG = {
            SEED_COUNT       : 85,    // Piksel karahindiba için ideal tohum sayısı
            BLOW_THRESHOLD   : 80,
            NOISE_ADAPT      : 0.015,
            WIND_FORCE       : 0.016,
            UPWARD_DRIFT     : -0.013,
            FRICTION         : 0.996,
            OSC_AMP_MIN      : 0.3,
            OSC_AMP_MAX      : 0.8,
            DETACH_PER_FRAME : 3,
            AUTO_DETACH_MS   : 2300,
            FINALE_DELAY_MS  : 4600,
            STAR_COUNT       : 60,
            CLOUD_COUNT      : 6,
            AURORA_WAVES     : 3,
            FIREFLY_COUNT    : 12
        };

        // Durumlar
        var S = { INTRO: 0, WAIT: 1, BLOW: 2, FINALE: 3 };
        var state = S.INTRO;

        // DOM
        var startEl  = document.getElementById('startScreen');
        var cvs      = document.getElementById('canvas');
        var c        = cvs.getContext('2d');
        var guideEl  = document.getElementById('guideContainer');
        var finaleEl = document.getElementById('finalMessage');

        // Sanal piksel koordinatları
        var W = 0, H = 0, vW = 0, vH = 0;
        var headX = 0, headY = 0, stemBaseY = 0;

        // Koleksiyonlar
        var seeds        = [];
        var stars        = [];
        var clouds       = [];
        var fireflies    = [];
        var sparkles     = [];
        var shootingStar = null;
        var lastShootT   = 0;

        // Ses
        var audioCtx = null, analyser = null, freqBuf = null, noiseFloor = 0;

        // Zaman
        var lastT = 0, ft = 0;
        var blownOnce = false, blowT0 = 0, finaleDone = false, started = false;

        // =====================================================================
        // CANVAS VE PİKSEL ÇÖZÜNÜRLÜĞÜ AYARI
        // =====================================================================
        function resize() {
            W = window.innerWidth;
            H = window.innerHeight;

            // Ekran genişliğine göre dinamik piksel ölçeği
            PIXEL_SIZE = W < 600 ? 3 : 4;

            vW = Math.floor(W / PIXEL_SIZE);
            vH = Math.floor(H / PIXEL_SIZE);

            cvs.width  = vW;
            cvs.height = vH;

            // Kesinlikle anti-aliasing (bulanıklık) kapalı olmalı!
            c.imageSmoothingEnabled = false;
            c.webkitImageSmoothingEnabled = false;
            c.mozImageSmoothingEnabled = false;
            c.msImageSmoothingEnabled = false;

            // Sanal piksel cinsinden konumlar
            headX     = Math.floor(vW * 0.5);
            headY     = Math.floor(vH * 0.38);
            stemBaseY = Math.floor(vH * 0.86);
        }

        // =====================================================================
        // PİKSEL BULUTLAR (PARALLAX CLOUDS)
        // =====================================================================
        function makeCloud() {
            return {
                x    : Math.random() * vW,
                y    : Math.floor(vH * 0.12 + Math.random() * (vH * 0.35)),
                w    : Math.floor(28 + Math.random() * 38),
                h    : Math.floor(9 + Math.random() * 12),
                speed: 0.05 + Math.random() * 0.09,
                layer: Math.random() < 0.5 ? 0 : 1 // 0: arka koyu, 1: ön gümüş
            };
        }

        function initClouds() {
            clouds = [];
            for (var i = 0; i < CFG.CLOUD_COUNT; i++) {
                clouds.push(makeCloud());
            }
        }

        // =====================================================================
        // PİKSEL YILDIZLAR (8-BIT STARS)
        // =====================================================================
        function makeStar() {
            return {
                x      : Math.floor(Math.random() * vW),
                y      : Math.floor(Math.random() * (vH * 0.65)),
                type   : Math.random() < 0.25 ? 1 : 0, // 0: 1-piksel, 1: 5-piksel haç yıldız
                baseOp : 0.4 + Math.random() * 0.6,
                op     : 1,
                phase  : Math.random() * Math.PI * 2,
                speed  : 0.015 + Math.random() * 0.03
            };
        }

        // =====================================================================
        // PİKSEL KAYAN YILDIZ
        // =====================================================================
        function makeShootingStar() {
            return {
                x    : Math.floor(Math.random() * (vW * 0.7)),
                y    : Math.floor(Math.random() * (vH * 0.22)),
                vx   : 2.5 + Math.random() * 2,
                vy   : 1.2 + Math.random() * 1.2,
                life : 1.0,
                decay: 0.03 + Math.random() * 0.02,
                len  : 14 + Math.floor(Math.random() * 10)
            };
        }

        // =====================================================================
        // PİKSEL ATEŞBÖCEKLERİ
        // =====================================================================
        function makeFirefly() {
            return {
                x    : Math.floor(Math.random() * vW),
                y    : Math.floor(vH * 0.25 + Math.random() * (vH * 0.55)),
                vx   : (Math.random() - 0.5) * 0.35,
                vy   : (Math.random() - 0.5) * 0.25,
                phase: Math.random() * Math.PI * 2,
                speed: 0.02 + Math.random() * 0.03
            };
        }

        // =====================================================================
        // PİKSEL KARAHİNDİBA TOHUMLARI
        // =====================================================================
        function makeSeed(i, total) {
            var t = i / (total - 1);
            var phi = Math.acos(1.0 - 1.9 * t);
            var theta = i * 2.3999632; // Altın açı

            var nx = Math.sin(phi) * Math.cos(theta);
            var ny = -Math.cos(phi);
            var nz = Math.sin(phi) * Math.sin(theta);

            var minL = Math.floor(vH * 0.075);
            var maxL = Math.floor(vH * 0.16);
            var len  = Math.floor(minL + (maxL - minL) * (0.7 + Math.random() * 0.3));

            var depthScale = 1.0 + nz * 0.25;
            var currentLen = Math.floor(len * depthScale);

            var tipX = Math.floor(headX + nx * currentLen);
            var tipY = Math.floor(headY + ny * currentLen);

            return {
                id        : i,
                nx        : nx,
                ny        : ny,
                nz        : nz, // Derinlik katmanı
                angle     : Math.atan2(ny, nx),
                length    : currentLen,
                tipX      : tipX,
                tipY      : tipY,
                attached  : true,
                x         : tipX,
                y         : tipY,
                vx        : 0,
                vy        : 0,
                oscPh     : Math.random() * Math.PI * 2,
                oscFr     : 0.02 + Math.random() * 0.03,
                oscAm     : CFG.OSC_AMP_MIN + Math.random() * (CFG.OSC_AMP_MAX - CFG.OSC_AMP_MIN),
                op        : 1.0,
                fade      : 0.002 + Math.random() * 0.002,
                stalkL    : Math.floor(currentLen * 0.32),
                isFront   : nz >= 0,
                swPh      : Math.random() * Math.PI * 2,
                swSp      : 0.003 + Math.random() * 0.004,
                trail     : []
            };
        }

        // Piksel Parlama / Kıvılcım (Hafifletilmiş 8-bit parıltı)
        function makeSparkle(x, y, isBlue) {
            return {
                x    : Math.floor(x),
                y    : Math.floor(y),
                color: isBlue ? '#70d6ff' : '#fff4d0',
                life : 1.0,
                decay: 0.05 + Math.random() * 0.04,
                vx   : (Math.random() - 0.5) * 1.2,
                vy   : (Math.random() - 0.5) * 1.2 - 0.3
            };
        }

        // =====================================================================
        // BAŞLATMA
        // =====================================================================
        function initAll() {
            seeds = [];
            for (var i = 0; i < CFG.SEED_COUNT; i++) {
                seeds.push(makeSeed(i, CFG.SEED_COUNT));
            }
            seeds.sort(function (a, b) { return a.nz - b.nz; });

            stars = [];
            for (var s = 0; s < CFG.STAR_COUNT; s++) stars.push(makeStar());

            initClouds();

            fireflies = [];
            for (var f = 0; f < CFG.FIREFLY_COUNT; f++) fireflies.push(makeFirefly());

            sparkles = [];
            shootingStar = null;
            lastShootT = performance.now();
        }

        // =====================================================================
        // SES MODÜLÜ (WEB AUDIO API)
        // =====================================================================
        async function initAudio() {
            try {
                var AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return false;
                audioCtx = new AC();
                if (audioCtx.state === 'suspended') await audioCtx.resume();
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;
                var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                var src    = audioCtx.createMediaStreamSource(stream);
                analyser   = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                analyser.smoothingTimeConstant = 0.35;
                src.connect(analyser);
                freqBuf = new Uint8Array(analyser.frequencyBinCount);
                return true;
            } catch (e) { return false; }
        }

        function blowLevel() {
            if (!analyser || !freqBuf) return 0;
            analyser.getByteFrequencyData(freqBuf);
            var sum = 0, n = 12;
            for (var i = 1; i <= n; i++) sum += freqBuf[i];
            var avg = sum / n;
            if (avg < CFG.BLOW_THRESHOLD * 0.7) {
                noiseFloor = noiseFloor * (1 - CFG.NOISE_ADAPT) + avg * CFG.NOISE_ADAPT;
            }
            var thr = Math.max(CFG.BLOW_THRESHOLD, noiseFloor * 2.5);
            return avg > thr ? Math.min((avg - thr) / (220 - thr), 1) : 0;
        }

        // =====================================================================
        // FİZİK & TOHUM KOPMA (8-BIT PHYSICS)
        // =====================================================================
        function detach(seed, inten) {
            seed.attached = false;
            var spd = (1.4 + Math.random() * 2.0) * Math.max(inten, 0.4);
            var va  = (Math.random() - 0.5) * 0.5;
            var la  = seed.angle + va;
            seed.vx = Math.cos(la) * spd * (0.8 + Math.random() * 0.4);
            seed.vy = Math.sin(la) * spd * 0.35 - (0.9 + Math.random() * 1.1) * Math.max(inten, 0.45);
            seed.x  = seed.tipX;
            seed.y  = seed.tipY;
            seed.trail = [];

            // Ayrılan tohumda hafif 8-bit parıltı
            if (Math.random() < 0.4) {
                sparkles.push(makeSparkle(seed.tipX, seed.tipY, Math.random() < 0.4));
            }
        }

        function updateSeed(seed, dt) {
            if (seed.attached) return true;
            seed.vx += (CFG.WIND_FORCE + (Math.random() - 0.5) * 0.004) * dt;
            seed.vy += CFG.UPWARD_DRIFT * dt;
            var f = Math.pow(CFG.FRICTION, dt);
            seed.vx *= f;
            seed.vy *= f;

            seed.oscPh += seed.oscFr * dt;
            var osc = Math.sin(seed.oscPh) * seed.oscAm;
            seed.x += (seed.vx + osc * 0.16) * dt;
            seed.y += seed.vy * dt;
            seed.op -= seed.fade * dt;

            // Piksel iz
            if (seed.trail.length === 0 || Math.random() < 0.3) {
                seed.trail.push({ x: Math.floor(seed.x), y: Math.floor(seed.y), op: seed.op * 0.5 });
                if (seed.trail.length > 5) seed.trail.shift();
            }

            return seed.op > 0.05 && seed.x > -40 && seed.x < vW + 40 &&
                   seed.y > -40 && seed.y < vH + 40;
        }

        // =====================================================================
        // ÇİZİM FONKSİYONLARI (GERÇEK PİKSEL GRAFİK RENDER)
        // =====================================================================

        // --- Piksel Gece Gökyüzü ve Dithering ---
        function drawSky() {
            // Katmanlı retro gökyüzü renk bantları
            var bands = [
                { y: 0,              color: '#04020c' },
                { y: vH * 0.22,      color: '#08051a' },
                { y: vH * 0.45,      color: '#0e0b2e' },
                { y: vH * 0.68,      color: '#13143d' },
                { y: vH * 0.88,      color: '#0a0d24' }
            ];

            // Renk bantlarını çiz
            for (var b = 0; b < bands.length; b++) {
                var startY = Math.floor(bands[b].y);
                var nextY  = b < bands.length - 1 ? Math.floor(bands[b + 1].y) : vH;
                c.fillStyle = bands[b].color;
                c.fillRect(0, startY, vW, nextY - startY);

                // Bant geçişinde retro piksel dither (damalı desen)
                if (b < bands.length - 1) {
                    var transY = nextY;
                    for (var x = 0; x < vW; x += 2) {
                        c.fillRect(x + (transY % 2), transY - 1, 1, 1);
                        c.fillRect(x + ((transY + 1) % 2), transY, 1, 1);
                    }
                }
            }
        }

        // --- Piksel Kuzey Işıkları (Aurora Borealis) ---
        function drawAurora() {
            var colors = [
                'rgba(40, 240, 180, 0.12)',  // Mint zümrüt
                'rgba(80, 190, 255, 0.14)',  // Elektrik cyan
                'rgba(180, 80, 255, 0.10)'   // Mor lavanta
            ];

            for (var w = 0; w < CFG.AURORA_WAVES; w++) {
                c.fillStyle = colors[w];
                var baseY = vH * 0.12 + w * 12;
                for (var x = 0; x < vW; x += 2) {
                    var waveH = Math.floor(
                        Math.sin(x * 0.04 + ft * 0.0012 + w) * 10 +
                        Math.cos(x * 0.02 + ft * 0.0008) * 8
                    );
                    var curY = Math.floor(baseY + waveH);
                    var h = Math.floor(18 + Math.sin(x * 0.05 + w) * 10);
                    c.fillRect(x, curY, 2, h);
                }
            }
        }

        // --- Piksel Ay (8-Bit Moon with Craters) ---
        function drawMoon() {
            var mx = Math.floor(vW * 0.82);
            var my = Math.floor(vH * 0.16);
            var mr = 13; // Piksel yarıçapı

            // Dış piksel hale dither halkası
            c.fillStyle = 'rgba(112, 214, 255, 0.12)';
            for (var dy = -mr - 4; dy <= mr + 4; dy += 2) {
                for (var dx = -mr - 4; dx <= mr + 4; dx += 2) {
                    var d2 = dx * dx + dy * dy;
                    if (d2 >= (mr) * (mr) && d2 <= (mr + 4) * (mr + 4)) {
                        c.fillRect(mx + dx, my + dy, 1, 1);
                    }
                }
            }

            // Ay ana diski (Piksel daire)
            c.fillStyle = '#e8f4ff';
            for (var y = -mr; y <= mr; y++) {
                var span = Math.floor(Math.sqrt(mr * mr - y * y));
                c.fillRect(mx - span, my + y, span * 2 + 1, 1);
            }

            // Ay gölgeleri ve kraterler
            c.fillStyle = '#a6c2e2';
            c.fillRect(mx - 4, my - 2, 4, 3);
            c.fillRect(mx + 2, my + 3, 3, 2);
            c.fillRect(mx - 2, my + 5, 4, 2);
            c.fillRect(mx + 3, my - 5, 2, 2);

            // Ay sağ kenar gölgesi (Hilal/derinlik hissi)
            c.fillStyle = '#8aaad0';
            c.fillRect(mx + mr - 2, my - 6, 2, 12);
        }

        // --- Piksel Bulutlar ---
        function updateDrawClouds() {
            for (var i = 0; i < clouds.length; i++) {
                var cl = clouds[i];
                cl.x += cl.speed;
                if (cl.x > vW + 10) cl.x = -cl.w - 10;

                var cx = Math.floor(cl.x);
                var cy = Math.floor(cl.y);

                c.fillStyle = cl.layer === 0 ? 'rgba(20, 24, 60, 0.65)' : 'rgba(45, 60, 110, 0.55)';

                // Piksel basamaklı bulut silueti
                c.fillRect(cx + 6, cy, cl.w - 12, cl.h);
                c.fillRect(cx + 2, cy + 2, cl.w - 4, cl.h - 4);
                c.fillRect(cx, cy + 4, cl.w, cl.h - 6);

                // Üst gümüş piksel parıltı çizgisi
                if (cl.layer === 1) {
                    c.fillStyle = 'rgba(180, 215, 255, 0.35)';
                    c.fillRect(cx + 6, cy, cl.w - 14, 1);
                    c.fillRect(cx + 2, cy + 2, 4, 1);
                }
            }
        }

        // --- Piksel Yıldızlar ---
        function drawStars() {
            for (var i = 0; i < stars.length; i++) {
                var s = stars[i];
                s.phase += s.speed;
                var blink = Math.sin(s.phase);

                if (blink < -0.2) continue; // Yanıp sönme

                var alpha = s.baseOp * (0.5 + 0.5 * blink);
                c.fillStyle = 'rgba(240, 248, 255, ' + alpha + ')';

                if (s.type === 0) {
                    // 1-piksel yıldız
                    c.fillRect(s.x, s.y, 1, 1);
                } else {
                    // 5-piksel 8-bit haç yıldız (+)
                    c.fillRect(s.x, s.y, 1, 1);
                    c.fillRect(s.x - 1, s.y, 1, 1);
                    c.fillRect(s.x + 1, s.y, 1, 1);
                    c.fillRect(s.x, s.y - 1, 1, 1);
                    c.fillRect(s.x, s.y + 1, 1, 1);
                }
            }
        }

        // --- Piksel Kayan Yıldız ---
        function updateDrawShootingStar(dt) {
            if (!shootingStar && ft - lastShootT > 5000) {
                if (Math.random() < 0.5) shootingStar = makeShootingStar();
                lastShootT = ft;
            }
            if (!shootingStar) return;
            var ss = shootingStar;
            ss.x += ss.vx * dt;
            ss.y += ss.vy * dt;
            ss.life -= ss.decay * dt;
            if (ss.life <= 0) { shootingStar = null; return; }

            var sx = Math.floor(ss.x);
            var sy = Math.floor(ss.y);

            // Baş pikseli
            c.fillStyle = '#ffffff';
            c.fillRect(sx, sy, 2, 2);

            // Stepped kuyruk pikselleri
            c.fillStyle = 'rgba(112, 214, 255, ' + (ss.life * 0.8) + ')';
            for (var k = 1; k <= ss.len; k++) {
                var tx = Math.floor(sx - (ss.vx * 0.6) * k);
                var ty = Math.floor(sy - (ss.vy * 0.6) * k);
                c.fillRect(tx, ty, 1, 1);
            }
        }

        // --- Piksel Ateşböcekleri ---
        function updateDrawFireflies(dt) {
            for (var i = 0; i < fireflies.length; i++) {
                var f = fireflies[i];
                f.phase += f.speed * dt;
                f.x += f.vx * dt;
                f.y += f.vy * dt;

                if (f.x < 5 || f.x > vW - 5) f.vx *= -1;
                if (f.y < vH * 0.2 || f.y > vH * 0.8) f.vy *= -1;

                var glow = Math.sin(f.phase);
                if (glow < 0.1) continue;

                var fx = Math.floor(f.x);
                var fy = Math.floor(f.y);

                c.fillStyle = 'rgba(120, 255, 180, ' + (0.5 * glow) + ')';
                c.fillRect(fx - 1, fy, 3, 1);
                c.fillRect(fx, fy - 1, 1, 3);

                c.fillStyle = 'rgba(255, 255, 200, ' + glow + ')';
                c.fillRect(fx, fy, 1, 1);
            }
        }

        // --- Piksel Parlamalar ---
        function updateDrawSparkles(dt) {
            var alive = [];
            for (var i = 0; i < sparkles.length; i++) {
                var s = sparkles[i];
                s.life -= s.decay * dt;
                s.x    += s.vx * dt;
                s.y    += s.vy * dt;
                if (s.life <= 0) continue;
                alive.push(s);

                c.fillStyle = s.color;
                c.fillRect(Math.floor(s.x), Math.floor(s.y), 1, 1);
            }
            sparkles = alive;
        }

        // =====================================================================
        // PİKSEL KARAHİNDİBA ELEMANLARI
        // =====================================================================

        // --- Piksel Sap (Segmented Pixel Stem) ---
        function drawStem() {
            var steps = 30;
            var prevX = headX;
            var prevY = headY;

            for (var i = 1; i <= steps; i++) {
                var t = i / steps;
                var midX = headX + Math.sin(t * Math.PI) * (vW * 0.018);
                var curX = Math.floor(midX);
                var curY = Math.floor(headY + (stemBaseY - headY) * t);

                // Ana gövde pikselleri (koyu zümrüt)
                c.fillStyle = '#224d28';
                c.fillRect(curX, curY, 2, 2);

                // Aydınlık sağ kenar pikselleri
                c.fillStyle = '#4fa35b';
                c.fillRect(curX + 1, curY, 1, 2);

                prevX = curX;
                prevY = curY;
            }
        }

        // --- Piksel Baş Yastığı & Çanak Yapraklar ---
        function drawHead() {
            // Çanak yapraklar (Yeşil sepal piksel basamakları)
            c.fillStyle = '#2d5e34';
            c.fillRect(headX - 4, headY + 2, 2, 3);
            c.fillRect(headX + 2, headY + 2, 2, 3);
            c.fillRect(headX - 6, headY + 4, 2, 2);
            c.fillRect(headX + 4, headY + 4, 2, 2);

            // Receptacle tohum yastığı (Amber-kahve 8-bit küme)
            c.fillStyle = '#5c4424';
            c.fillRect(headX - 3, headY - 2, 7, 5);
            c.fillStyle = '#8f6e3c';
            c.fillRect(headX - 2, headY - 1, 5, 3);
            c.fillStyle = '#e8d4a2';
            c.fillRect(headX - 1, headY, 3, 1);
        }

        // --- Piksel Tüy (Pappus Parachute) Çizimi ---
        function drawPixelPappus(px, py, isFront) {
            c.fillStyle = isFront ? '#ffffff' : '#b0c8e8';

            // Merkez düğüm
            c.fillRect(px, py, 1, 1);

            // 8-Bit T-biçimli paraşüt tüy yapısı
            c.fillRect(px - 1, py - 1, 3, 1);
            c.fillRect(px - 2, py - 2, 1, 1);
            c.fillRect(px + 2, py - 2, 1, 1);
            c.fillRect(px - 3, py - 3, 1, 1);
            c.fillRect(px + 3, py - 3, 1, 1);
            c.fillRect(px, py - 2, 1, 1);
        }

        // --- Bağlı Piksel Tohum ---
        function drawAttachedSeed(seed) {
            var sw = Math.sin(ft * seed.swSp + seed.swPh) * 0.015;
            var ang = seed.angle + sw;
            var tx = Math.floor(headX + Math.cos(ang) * seed.length);
            var ty = Math.floor(headY + Math.sin(ang) * seed.length);
            seed.tipX = tx;
            seed.tipY = ty;

            // Tohum sapı çizgisi (Bresenham / Stepped line)
            c.fillStyle = seed.isFront ? 'rgba(255, 255, 255, 0.45)' : 'rgba(160, 185, 220, 0.25)';
            var steps = 6;
            for (var s = 1; s < steps; s++) {
                var lx = Math.floor(headX + (tx - headX) * (s / steps));
                var ly = Math.floor(headY + (ty - headY) * (s / steps));
                c.fillRect(lx, ly, 1, 1);
            }

            // Dipte amber tohum tanesi (Achene)
            var ax = Math.floor(headX + Math.cos(ang) * 4);
            var ay = Math.floor(headY + Math.sin(ang) * 4);
            c.fillStyle = '#b88636';
            c.fillRect(ax, ay, 1, 1);

            // Uçtaki paraşüt
            drawPixelPappus(tx, ty, seed.isFront);
        }

        // --- Uçan Piksel Tohum ---
        function drawFlyingSeed(seed) {
            var sx = Math.floor(seed.x);
            var sy = Math.floor(seed.y);

            // Narin 1-piksel kuyruk izi
            if (seed.trail.length > 1) {
                c.fillStyle = 'rgba(112, 214, 255, 0.35)';
                for (var t = 0; t < seed.trail.length; t++) {
                    c.fillRect(seed.trail[t].x, seed.trail[t].y, 1, 1);
                }
            }

            // Sap çizgisi (Aşağı doğru uzanan 3 piksel)
            c.fillStyle = 'rgba(255, 255, 255, 0.55)';
            c.fillRect(sx, sy + 1, 1, 1);
            c.fillRect(sx, sy + 2, 1, 1);
            c.fillRect(sx, sy + 3, 1, 1);

            // Tohum tanesi (Achene)
            c.fillStyle = '#d49b4b';
            c.fillRect(sx, sy + 4, 1, 1);

            // Paraşüt (Pappus)
            drawPixelPappus(sx, sy, true);
        }

        // =====================================================================
        // FİNALE GEÇİŞ
        // =====================================================================
        function startFinale() {
            if (finaleDone) return;
            finaleDone = true;
            state = S.FINALE;
            cvs.classList.add('fade-out');
            guideEl.classList.remove('visible');
            guideEl.classList.add('fade-out');
            setTimeout(function () {
                finaleEl.classList.add('visible');
            }, 1800);
        }

        // =====================================================================
        // ANA DÖNGÜ (ANIMATION LOOP)
        // =====================================================================
        function loop(ts) {
            var raw = lastT ? ts - lastT : 16.67;
            var dt  = Math.min(raw / 16.67, 3);
            lastT = ts;
            ft    = ts;

            c.clearRect(0, 0, vW, vH);

            if (state === S.WAIT || state === S.BLOW || state === S.FINALE) {
                // 1) Piksel gökyüzü & dithering
                drawSky();

                // 2) Kuzey Işıkları (Aurora)
                drawAurora();

                // 3) Piksel Ay
                drawMoon();

                // 4) Bulutlar & Yıldızlar
                updateDrawClouds();
                drawStars();
                updateDrawShootingStar(dt);

                // 5) Ateşböcekleri
                updateDrawFireflies(dt);
            }

            if (state === S.WAIT || state === S.BLOW) {
                // Üfleme algılama
                var bl = blowLevel();
                if (bl > 0 && state === S.WAIT) {
                    state = S.BLOW;
                    blownOnce = true;
                    blowT0 = Date.now();
                    guideEl.classList.remove('visible');
                    guideEl.classList.add('fade-out');
                }

                if (bl > 0 && state === S.BLOW) {
                    var att = [];
                    for (var a = 0; a < seeds.length; a++) {
                        if (seeds[a].attached) att.push(seeds[a]);
                    }
                    var cnt = Math.min(Math.ceil(bl * CFG.DETACH_PER_FRAME), att.length);
                    for (var d = 0; d < cnt; d++) {
                        var idx = Math.floor(Math.random() * att.length);
                        detach(att[idx], bl);
                        att.splice(idx, 1);
                    }
                }

                // Otomatik kopma
                if (blownOnce && Date.now() - blowT0 > CFG.AUTO_DETACH_MS) {
                    var sa = [];
                    for (var sa2 = 0; sa2 < seeds.length; sa2++) {
                        if (seeds[sa2].attached) sa.push(seeds[sa2]);
                    }
                    if (sa.length > 0) {
                        var ac = Math.min(2, sa.length);
                        for (var ad = 0; ad < ac; ad++) {
                            var ai = Math.floor(Math.random() * sa.length);
                            detach(sa[ai], 0.35);
                            sa.splice(ai, 1);
                        }
                    }
                }

                // Fizik güncelle
                var alive = [];
                for (var u = 0; u < seeds.length; u++) {
                    if (updateSeed(seeds[u], dt)) alive.push(seeds[u]);
                }
                seeds = alive;

                // --- 3D Piksel Karahindiba Çizimi ---
                updateDrawSparkles(dt);

                // 1) Arka plan tohumları
                for (var bg = 0; bg < seeds.length; bg++) {
                    if (seeds[bg].attached && !seeds[bg].isFront) {
                        drawAttachedSeed(seeds[bg]);
                    }
                }

                // 2) Sap ve Baş
                drawStem();
                drawHead();

                // 3) Ön plan tohumları
                for (var fg = 0; fg < seeds.length; fg++) {
                    if (seeds[fg].attached && seeds[fg].isFront) {
                        drawAttachedSeed(seeds[fg]);
                    }
                }

                // 4) Uçan tohumlar
                for (var fl = 0; fl < seeds.length; fl++) {
                    if (!seeds[fl].attached) {
                        drawFlyingSeed(seeds[fl]);
                    }
                }

                // Finale kontrolü
                if (blownOnce && !finaleDone) {
                    var allDet = true, flyC = 0;
                    for (var fc = 0; fc < seeds.length; fc++) {
                        if (seeds[fc].attached) { allDet = false; break; }
                        if (seeds[fc].op > 0.05) flyC++;
                    }
                    if ((allDet && flyC === 0 && seeds.length === 0) ||
                        Date.now() - blowT0 > CFG.FINALE_DELAY_MS) {
                        startFinale();
                    }
                }
            }

            if (state === S.FINALE) {
                var rem = [];
                for (var rs = 0; rs < seeds.length; rs++) {
                    if (updateSeed(seeds[rs], dt)) {
                        rem.push(seeds[rs]);
                        if (!seeds[rs].attached) drawFlyingSeed(seeds[rs]);
                    }
                }
                seeds = rem;
                updateDrawSparkles(dt);
            }

            requestAnimationFrame(loop);
        }

        // =====================================================================
        // OLAY DİNLEYİCİLERİ
        // =====================================================================
        async function go(e) {
            if (started) return;
            started = true;
            if (e.cancelable) e.preventDefault();

            var ok = await initAudio();
            if (!ok) {
                started = false;
                var h = startEl.querySelector('.tap-hint');
                h.textContent = 'MİKROFON İZNİ GEREKLİ!';
                h.style.color = '#ff6b6b';
                h.style.animation = 'none';
                return;
            }

            resize();
            initAll();
            startEl.classList.add('hidden');
            state = S.WAIT;

            setTimeout(function () {
                guideEl.classList.add('visible');
            }, 1600);

            requestAnimationFrame(loop);
        }

        startEl.addEventListener('touchstart', go, { passive: false });
        startEl.addEventListener('click', go);

        window.addEventListener('resize', function () {
            if (state === S.INTRO) return;
            var oVW = vW, oVH = vH;
            resize();

            // Sanal çözünürlük ölçekleme
            if (oVW && oVH) {
                var sx = vW / oVW, sy = vH / oVH;
                for (var j = 0; j < seeds.length; j++) {
                    if (!seeds[j].attached) {
                        seeds[j].x *= sx;
                        seeds[j].y *= sy;
                    }
                }
            }
        });

        window.addEventListener('orientationchange', function () {
            setTimeout(function () {
                if (state !== S.INTRO) resize();
            }, 250);
        });

    })();
    </script>
</body>
